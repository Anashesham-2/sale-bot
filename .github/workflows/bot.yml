name: Telegram Deals Bot

on:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - 'product_intelligence.py'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'
  schedule:
    # شبكة أمان احتياطية فقط لو تعثرت التشغيلة التلقائية المتسلسلة
    - cron: '*/20 * * * *'
  workflow_dispatch: # تشغيل فوري تلقائي عند انتهاء كل جلسة أو تشغيل يدوي

permissions:
  contents: write
  actions: write

concurrency:
  group: deals-bot
  # إلغاء الجلسة الشغالة فقط عند رفع تعديل كود جديد (push)، وعدم قطع البوت أبداً أثناء الفحص في الجدولة!
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scrape-deals:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      # المدة بين كل فحص والتاني بالثواني (180 = 3 دقايق)
      CHECK_INTERVAL: "180"
      # مدة التشغيلة الواحدة بالدقايق (300 دقيقة = 5 ساعات لضمان الانتهاء قبل حد الـ 355 دقيقة وتفعيل التشغيلة التالية)
      RUN_MINUTES: "300"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        id: pip
        timeout-minutes: 5
        run: |
          pip install --prefer-binary --timeout 20 -r requirements.txt
          PW_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))")
          echo "pw_ver=$PW_VER" >> "$GITHUB_OUTPUT"

      - name: Cache HuggingFace Vision Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-onnx-v1

      - name: Preload Vision Model
        timeout-minutes: 3
        continue-on-error: true
        run: |
          timeout 90 python -c "import product_intelligence as pi; pi._ensure_vision_loaded()" || true

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pip.outputs.pw_ver }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Verify Xvfb and Chromium system libs (skip slow APT if already installed)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v xvfb-run >/dev/null 2>&1 && ldconfig -p | grep -q "libnss3.so" && ldconfig -p | grep -q "libgbm.so"; then
            echo "Xvfb and core Chromium libraries are already pre-installed on this runner; skipping apt-get."
            exit 0
          fi
          echo "Missing Xvfb or core libs; attempting lightweight install..."
          sudo find /etc/apt/sources.list.d/ -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete || true
          sudo timeout 45 apt-get update || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y --no-install-recommends xvfb libnss3 libnspr4 libgbm1 || true

      - name: Install Playwright Chromium browser
        timeout-minutes: 5
        run: |
          timeout 180 playwright install chromium || (rm -rf ~/.cache/ms-playwright && timeout 180 playwright install chromium)

      - name: Run deals bot in a loop
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          run_py() {
            if command -v xvfb-run >/dev/null 2>&1; then
              xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python -u "$@"
            else
              python -u "$@"
            fi
          }
          END=$((SECONDS + RUN_MINUTES * 60))
          while [ $SECONDS -lt $END ]; do
            git fetch origin main || true
            git reset --hard origin/main || true
            run_py bot.py --once || echo "Cycle failed"

            # حفظ العروض المرسلة وسجل الأسعار وذاكرة التعلم بعد كل دورة
            git add sent_deals.txt price_history.json learned_preferences.json pending_deals.json || true
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: update deals data [skip ci]" || true
              git pull --rebase origin main || true
              git push origin HEAD:main || echo "Push failed"
            fi

            echo "Waiting ${CHECK_INTERVAL}s (while listening for private chat links)..."
            run_py bot.py --listen-only "$CHECK_INTERVAL" || sleep "$CHECK_INTERVAL"

            git add sent_deals.txt price_history.json learned_preferences.json pending_deals.json || true
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: update deals data [skip ci]" || true
              git pull --rebase origin main || true
              git push origin HEAD:main || echo "Push failed"
            fi
          done

      - name: Trigger next continuous session immediately (Zero-Downtime Self-Chain)
        if: ${{ !cancelled() && steps.run_bot.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next 6-hour bot session immediately via workflow_dispatch..."
          gh workflow run bot.yml --ref main || true
