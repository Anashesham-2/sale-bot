name: Telegram Deals Bot

on:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - 'product_intelligence.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  schedule:
    # شبكة أمان احتياطية فقط لو تعثرت التشغيلة التلقائية المتسلسلة
    - cron: '*/20 * * * *'
  workflow_dispatch: # تشغيل فوري تلقائي عند انتهاء كل جلسة أو تشغيل يدوي

permissions:
  contents: write
  actions: write

concurrency:
  group: deals-bot
  # إلغاء الجلسة الشغالة فقط عند رفع تعديل كود جديد (push)، وعدم قطع البوت أبداً أثناء الفحص في الجدولة!
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scrape-deals:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      # المدة بين كل فحص والتاني بالثواني (180 = 3 دقايق)
      CHECK_INTERVAL: "180"
      # مدة التشغيلة الواحدة بالدقايق (أقصى حد في GitHub 6 ساعات)
      RUN_MINUTES: "340"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "20000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        id: pip
        timeout-minutes: 5
        run: |
          pip install --prefer-binary --timeout 20 -r requirements.txt
          PW_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))")
          echo "pw_ver=$PW_VER" >> "$GITHUB_OUTPUT"

      - name: Cache HuggingFace Vision Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-onnx-v1

      - name: Preload Vision Model
        timeout-minutes: 3
        continue-on-error: true
        run: |
          timeout 90 python -c "import product_intelligence as pi; pi._ensure_vision_loaded()" || true

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pip.outputs.pw_ver }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Configure fast APT and install Xvfb and Chromium deps
        timeout-minutes: 5
        run: |
          sudo tee /etc/apt/apt.conf.d/99fast-apt >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF

          if ! sudo timeout 60 apt-get update; then
            echo "apt-get update stalled/failed; isolating official Ubuntu repos and switching mirror..."
            sudo find /etc/apt/sources.list.d/ -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete || true
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo timeout 60 apt-get update
          fi

          sudo DEBIAN_FRONTEND=noninteractive timeout 120 apt-get install -y --no-install-recommends xvfb
          if ! timeout 150 playwright install-deps chromium; then
            echo "playwright install-deps failed; isolating official Ubuntu repos and retrying..."
            sudo find /etc/apt/sources.list.d/ -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete || true
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            timeout 150 playwright install-deps chromium
          fi

      - name: Install Playwright Chromium browser
        timeout-minutes: 5
        run: |
          timeout 180 playwright install chromium || (rm -rf ~/.cache/ms-playwright && timeout 180 playwright install chromium)

      - name: Run deals bot in a loop
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + RUN_MINUTES * 60))
          while [ $SECONDS -lt $END ]; do
            git fetch origin main || true
            git reset --hard origin/main || true
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python -u bot.py --once || echo "Cycle failed"

            # حفظ العروض المرسلة وسجل الأسعار وذاكرة التعلم بعد كل دورة
            git add sent_deals.txt price_history.json learned_preferences.json pending_deals.json || true
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: update deals data [skip ci]" || true
              git push origin HEAD:main || echo "Push failed"
            fi

            echo "Waiting ${CHECK_INTERVAL}s (while listening for private chat links)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python -u bot.py --listen-only "$CHECK_INTERVAL" || sleep "$CHECK_INTERVAL"

            git add sent_deals.txt price_history.json learned_preferences.json pending_deals.json || true
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: update deals data [skip ci]" || true
              git push origin HEAD:main || echo "Push failed"
            fi
          done

      - name: Trigger next continuous session immediately (Zero-Downtime Self-Chain)
        if: ${{ !cancelled() && steps.run_bot.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next 6-hour bot session immediately via workflow_dispatch..."
          gh workflow run bot.yml --ref main || true
