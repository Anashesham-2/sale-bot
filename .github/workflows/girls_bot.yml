name: Girls Deals Bot (TikTok + Girls Channel)

on:
  push:
    branches:
      - main
    paths:
      - 'girls_bot.py'
      - 'girls_engine.py'
      - 'tiktok_card_designer.py'
      - 'product_intelligence.py'
      - '.github/workflows/girls_bot.yml'
  schedule:
    # شبكة أمان احتياطية كل 25 دقيقة تضمن استمرار العمل 24/7 بدون انقطاع
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      force_tiktok:
        description: 'إرسال بوست تيك توك تجريبي فوراً خارج أوقات الذروة؟ (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: girls-bot
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  girls-deals:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      CHECK_INTERVAL: "240"
      RUN_MINUTES: "300"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        id: pip
        timeout-minutes: 5
        run: |
          pip install --prefer-binary --timeout 20 -r requirements.txt
          PW_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))")
          echo "pw_ver=$PW_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pip.outputs.pw_ver }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Verify Xvfb and Chromium system libs (skip slow APT if already installed)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v xvfb-run >/dev/null 2>&1 && ldconfig -p | grep -q "libnss3.so" && ldconfig -p | grep -q "libgbm.so"; then
            echo "Xvfb and core Chromium libraries are already pre-installed; skipping apt-get."
            exit 0
          fi
          sudo find /etc/apt/sources.list.d/ -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete || true
          sudo timeout 45 apt-get update || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y --no-install-recommends xvfb libnss3 libnspr4 libgbm1 || true

      - name: Install Playwright Chromium browser
        timeout-minutes: 5
        run: |
          timeout 180 playwright install chromium || (rm -rf ~/.cache/ms-playwright && timeout 180 playwright install chromium)

      - name: Run Girls Bot in a continuous 24/7 loop (Independent of Main Channel)
        id: run_girls
        env:
          FORCE_TIKTOK_ONCE: ${{ github.event.inputs.force_tiktok == 'true' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIRLS_BOT_TOKEN: ${{ secrets.GIRLS_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GIRLS_CHANNEL_ID: ${{ secrets.GIRLS_CHANNEL_ID }}
          GIRLS_CHANNEL_USERNAME: ${{ secrets.GIRLS_CHANNEL_USERNAME }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          NOON_COUPON: ${{ secrets.NOON_COUPON }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_POST_MODE: ${{ secrets.TIKTOK_POST_MODE }}
          TIKTOK_WEBHOOK_URL: ${{ secrets.TIKTOK_WEBHOOK_URL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          run_py() {
            if command -v xvfb-run >/dev/null 2>&1; then
              xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python -u "$@"
            else
              python -u "$@"
            fi
          }

          save_girls_state() {
            for f in girls_sent_deals.txt girls_tiktok_sent.txt girls_state.json; do
              [ -f "$f" ] && git add "$f"
            done
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: update girls bot state [skip ci]" || true
              for attempt in 1 2 3; do
                git pull --rebase --autostash origin main && git push origin HEAD:main && break
                sleep 3
              done
            fi
          }

          END=$((SECONDS + RUN_MINUTES * 60))
          FIRST_CYCLE=1
          while [ $SECONDS -lt $END ]; do
            git fetch origin main || true
            git reset --hard origin/main || true
            if [ "$FIRST_CYCLE" -eq 1 ]; then
              run_py girls_bot.py --once || echo "Girls cycle failed"
              FIRST_CYCLE=0
            else
              FORCE_TIKTOK_ONCE=0 run_py girls_bot.py --once || echo "Girls cycle failed"
            fi
            save_girls_state

            REMAIN=$((END - SECONDS))
            if [ $REMAIN -le 30 ]; then
              break
            fi
            WAIT_S=$CHECK_INTERVAL
            if [ $REMAIN -lt $((WAIT_S + 20)) ]; then
              WAIT_S=$((REMAIN - 20))
            fi
            echo "Waiting ${WAIT_S}s (listening to @Loqta_Girlsbot private chat)..."
            run_py girls_bot.py --listen-only "$WAIT_S" || sleep "$WAIT_S"
            save_girls_state
          done

      - name: Trigger next continuous Girls Bot session immediately (Zero-Downtime Self-Chain)
        if: ${{ !cancelled() && steps.run_girls.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next 5-hour Girls Bot session immediately via workflow_dispatch..."
          gh workflow run girls_bot.yml --ref main || true
